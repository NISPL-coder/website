name: Sync Postman Collection

on:
  push:
    branches:
      - debasish_dev
      - main
    paths:
      - 'website/Backend/**'
      - 'website/backend/**'
      - 'Backend/**'
      - 'backend/**'
      - '.github/workflows/**'
      - '**.json'
  workflow_dispatch:

jobs:
  update-postman:
    name: Generate & Sync Postman Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate Backend and Generate Collection
        id: locate
        run: |
          if [ -d "./website/backend" ]; then
            TARGET_DIR="./website/backend"
          elif [ -d "./website/Backend" ]; then
            TARGET_DIR="./website/Backend"
          elif [ -d "./backend" ]; then
            TARGET_DIR="./backend"
          elif [ -d "./Backend" ]; then
            TARGET_DIR="./Backend"
          else
            echo "::error::Backend directory not found"
            exit 1
          fi
          echo "target_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"
          echo "Working in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          node generatePostmanCollection.js

      - name: Push Collection to Postman Cloud API
        run: |
          TARGET_DIR="${{ steps.locate.outputs.target_dir }}"
          cd "$TARGET_DIR"
          
          # Default to NISPL collection UID if secret is not set
          COLLECTION_UID="${{ secrets.POSTMAN_COLLECTION_UID }}"
          if [ -z "$COLLECTION_UID" ]; then
            COLLECTION_UID="59177886-869e0ccc-64e7-47df-b673-4c83772dd1d8"
          fi
          
          export POSTMAN_API_KEY="${{ secrets.POSTMAN_API_KEY }}"
          export POSTMAN_COLLECTION_UID="$COLLECTION_UID"
          
          node scripts/sync-postman.mjs
