name: Sync Postman Collection

on:
  push:
    branches:
      - debasish_dev
      - main
    paths:
      - 'website/Backend/generatePostmanCollection.js'
      - 'website/backend/generatePostmanCollection.js'
      - 'Backend/generatePostmanCollection.js'
      - 'backend/generatePostmanCollection.js'
      - '.github/workflows/postman-sync.yml'
  workflow_dispatch:

jobs:
  update-postman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Locate Backend and Generate Postman JSON
        id: postman-gen
        run: |
          if [ -d "./website/Backend" ]; then
            TARGET_DIR="./website/Backend"
          elif [ -d "./website/backend" ]; then
            TARGET_DIR="./website/backend"
          elif [ -d "./Backend" ]; then
            TARGET_DIR="./Backend"
          elif [ -d "./backend" ]; then
            TARGET_DIR="./backend"
          else
            echo "Error: Backend directory not found"
            exit 1
          fi
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          cd "$TARGET_DIR"
          node generatePostmanCollection.js
          jq '{collection: .}' NISPL_API_Postman_Collection.json > payload.json

      - name: Push to Postman API
        run: |
          TARGET_DIR="${{ steps.postman-gen.outputs.target_dir }}"
          cd "$TARGET_DIR"
          echo "Sending payload to Postman API..."
          curl -w "\nHTTP Status: %{http_code}\n" --location --request PUT "https://api.getpostman.com/collections/${{ secrets.POSTMAN_COLLECTION_UID }}" \
          --header "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
          --header "Content-Type: application/json" \
          --data-binary "@payload.json"

